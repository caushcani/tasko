name: tasko

# Local development stack — source is bind-mounted and both apps hot-reload.
#   docker compose -f docker/docker-compose.yml up --build
#
# For an immutable, production-style stack (built images, no mounts), add the
# prod overlay:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up --build -d
#
# Published to the host: core 8100, web 3100, postgres 5434 (for DBeaver etc).
# redis stays on the compose network only. Container-internal ports are
# standard, so the service-to-service URLs below stay clean.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasko
      POSTGRES_PASSWORD: tasko
      POSTGRES_DB: tasko
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasko"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
      target: dev
    environment:
      TASKO_CONFIG: /app/tasko.docker.yaml
    volumes:
      - ../tasko.docker.yaml:/app/tasko.docker.yaml:ro
      - ../packages:/app/packages          # edit Python → uvicorn --reload
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      target: dev
    environment:
      TASKO_CORE_URL: http://core:8000            # server-side (SSR prefetch): internal network
      NEXT_PUBLIC_TASKO_CORE_URL: http://localhost:8100  # client-side (browser): the published port
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"             # reliable file watching on bind mounts
    volumes:
      - ../web:/app                          # edit web/ → Next HMR
      - /app/node_modules                    # keep the image's install
      - /app/.next                           # keep build cache in-container
    ports:
      - "3100:3000"
    depends_on:
      - core

volumes:
  pgdata:
