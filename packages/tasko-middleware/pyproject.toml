[project]
name = "tasko-middleware"
version = "0.1.0"
description = "Broker-agnostic TaskiqMiddleware that reports task lifecycle events to tasko-core"
requires-python = ">=3.11"
dependencies = [
    "taskiq>=0.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasko_middleware"]
