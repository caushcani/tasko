[project]
name = "tasko-nats"
version = "0.0.0"
description = "NATS BrokerAdapter for Tasko (stub — not implemented yet)"
requires-python = ">=3.11"
dependencies = [
    "tasko-core",
    "nats-py>=2.7",
]

[project.entry-points."tasko.adapters"]
nats = "tasko_nats.adapter:NatsAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasko_nats"]
