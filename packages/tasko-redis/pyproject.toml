[project]
name = "tasko-redis"
version = "0.1.0"
description = "Redis BrokerAdapter for Tasko"
requires-python = ">=3.11"
dependencies = [
    "tasko-core",
    "redis>=5.0",
]

[project.entry-points."tasko.adapters"]
redis = "tasko_redis.adapter:RedisAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasko_redis"]
