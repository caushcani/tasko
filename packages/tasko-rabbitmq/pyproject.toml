[project]
name = "tasko-rabbitmq"
version = "0.0.0"
description = "RabbitMQ BrokerAdapter for Tasko (stub — not implemented yet)"
requires-python = ">=3.11"
dependencies = [
    "tasko-core",
    "aio-pika>=9.4",
]

[project.entry-points."tasko.adapters"]
rabbitmq = "tasko_rabbitmq.adapter:RabbitMQAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasko_rabbitmq"]
