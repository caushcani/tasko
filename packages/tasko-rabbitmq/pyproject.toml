[project]
name = "tasko-rabbitmq"
version = "0.1.0"
description = "RabbitMQ BrokerAdapter for Tasko — reads queue depth via the HTTP Management API"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caush Cani", email = "caushcani@gmail.com" }]
dependencies = [
    "tasko-core",
    "httpx>=0.27",
]

[project.entry-points."tasko.adapters"]
rabbitmq = "tasko_rabbitmq.adapter:RabbitMQAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasko_rabbitmq"]
