# Config used by the `core` service in docker/docker-compose.yml.
server:
  host: 0.0.0.0
  port: 8000

database:
  url: postgresql+asyncpg://tasko:tasko@postgres:5432/tasko

broker:
  adapter: redis
  options:
    url: redis://redis:6379/0

workers:
  # Generous on purpose — this file is the local docker-compose dev config
  # (see docker/docker-compose.yml), where nothing keeps heartbeating
  # between manual test runs. A real deployment should tune this down;
  # 30-60s is reasonable given tasko-middleware's default 10s interval.
  ttl_seconds: 3600

retention:
  finished_tasks: 7d
